* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f1117;

  --surface-hover: #222636;
  --border: #2a2e3a;
  --text: #e1e4ea;

  --amber: #ffa726;

  --purple: #7e57c2;
  --pink: #ec407a;
  --accent: #5c6bc0;
  --card-radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.6;
  padding: 24px;
  max-width: 1400px;
  margin: 0 auto;

h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
h2 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 16px; }
h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

.header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
}
.header-left h1 { margin-bottom: 4px; }
.header-left .subtitle { color: var(--text-secondary); font-size: 13px; }
.header-right { text-align: right; }
.header-right .update-time { font-size: 12px; color: var(--text-muted); }
.header-right .refresh-btn {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 8px;
}
.refresh-btn:hover { background: var(--surface-hover); }
.live-dot {
  display: inline-block; width: 7px; height: 7px; background: var(--green);
  border-radius: 50%; margin-right: 4px; animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.metrics-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px; margin-bottom: 28px;
}
.metric-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--card-radius); padding: 16px 20px;
}
.metric-card .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.metric-card .value { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
.metric-card .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.value.green { color: var(--green); }
.value.red { color: var(--red); }
.green { color: var(--green); }
.red { color: var(--red); }
.value.amber { color: var(--amber); }

.section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--card-radius); padding: 20px 24px; margin-bottom: 20px;
}
.section-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
}
.section-header h2 { margin-bottom: 0; }

table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
th { text-align: left; padding: 10px 12px; color: var(--text-muted); font-weight: 500;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; border-bottom: 1px solid rgba(42,46,58,0.5); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 500;
}
.tag-risk { background: rgba(239,83,80,0.15); color: var(--red); }
.tag-short { background: rgba(255,167,38,0.15); color: var(--amber); }
.tag-advisory { background: rgba(126,87,194,0.15); color: var(--purple); }
.tag-watch { background: rgba(66,165,245,0.1); color: var(--blue); }

.status-bar {
  height: 4px; border-radius: 2px; background: var(--border); margin-top: 4px; overflow: hidden;
}
.status-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
.status-safe { background: var(--green); }
.status-warn { background: var(--amber); }
.status-danger { background: var(--red); }

.fcn-card {
  border: 1px solid var(--border); border-radius: 10px; padding: 16px;
  margin-bottom: 12px; background: rgba(255,255,255,0.01);
}
.fcn-card:last-child { margin-bottom: 0; }
.fcn-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.fcn-title { font-weight: 600; font-size: 14px; }
.fcn-days { font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 500; }
.fcn-days.urgent { background: rgba(239,83,80,0.15); color: var(--red); }
.fcn-days.soon { background: rgba(255,167,38,0.15); color: var(--amber); }
.fcn-days.safe { background: rgba(38,166,154,0.15); color: var(--green); }
.fcn-row { display: flex; gap: 24px; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.fcn-row span { color: var(--text); font-weight: 500; }

.watch-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px;
}
.watch-card {
  border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
  background: rgba(255,255,255,0.01);
}
.watch-card .stock-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.watch-card .stock-symbol { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
.watch-card .stock-price { font-size: 18px; font-weight: 600; }
.watch-card .stock-target { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.watch-card .stock-note { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-style: italic; }
.watch-card.status-overvalued { border-left: 3px solid var(--red); }
.watch-card.status-fair { border-left: 3px solid var(--amber); }
.watch-card.status-undervalued { border-left: 3px solid var(--green); }
.watch-card.status-watching { border-left: 3px solid var(--blue); }

.concentration-warning {
  background: rgba(239,83,80,0.08); border: 1px solid rgba(239,83,80,0.2);

.framework-box {

.loading { text-align: center; padding: 40px; color: var(--text-muted); }
.error { color: var(--red); padding: 12px; }
.price-loading { color: var(--text-muted); font-style: italic; }

function safeFloat(s) { const n = parseFloat(s); return isNaN(n) ? null : n; }

      const m = line.match(/^v_(\w+)="([^"]*)"/);
      if (!m) continue;
      const qtCode = m[1], raw = m[2];
      const f = raw.split('~');
      if (f.length < 40) continue;
      const symbol = QT_REVERSE[qtCode];
      if (!symbol) continue;
      const price = safeFloat(f[3]);
      const prev = safeFloat(f[4]);
      const pe = safeFloat(f[39]);
      const mcap = safeFloat(f[44]);
      let currency = 'CNY';
      if (qtCode.startsWith('hk')) currency = 'HKD';
      else if (qtCode.startsWith('us')) currency = 'USD';
      results[symbol] = {
        name: f[1], price, prev_close: prev, pe, market_cap: mcap, currency,
        change_pct: (price && prev && prev !== 0) ? +((price-prev)/prev*100).toFixed(2) : null
      };
    }
    if (Object.keys(results).length > 0) {
      prices = results;
      document.getElementById('priceStatus').innerHTML =
        '<span class="live-dot"></span>实时股价 ' + new Date().toLocaleTimeString('zh-CN');
      renderPositions(portfolio);
      renderFCN(portfolio);
      renderWatchlist(portfolio);
      updateTencentExposure();
    }
  } catch(e) {
    document.getElementById('priceStatus').innerHTML =
      '<span style="color:var(--amber);">股价更新失败，60秒后重试</span>';
  }
}

function refreshPrices() { loadPrices(true); }

function loadPortfolio() {
  renderMetrics(portfolio);
  renderPositions(portfolio);
  renderFCN(portfolio);
  renderWatchlist(portfolio);
}

function getPrice(symbol) {
  if (!symbol) return null;
  const q = prices[symbol];
  if (!q) return null;
  return { price: q.price, pe: q.pe, change_pct: q.change_pct, prev_close: q.previous_close, currency: q.currency };
}

function priceDisplay(symbol, cost, value, shares) {
  const q = getPrice(symbol);
  if (!q || !q.price) return { price: '<span class="price-loading">加载中</span>', pe: '---', pnl: '---', pnlNum: 0 };
  if (!cost) return { price: (q.currency === 'HKD' ? 'HK$' : q.currency === 'USD' ? '$' : '¥') + NUM(q.price), pe: q.pe ? NUM(q.pe, 1) : '---', pnl: '---', pnlNum: 0 };

  const pnlPct = ((q.price - cost) / cost * 100);
  const cls = pnlPct >= 0 ? 'green' : 'red';
  const sign = pnlPct >= 0 ? '+' : '';
  return {
    price: (q.currency === 'HKD' ? 'HK$' : q.currency === 'USD' ? '$' : '¥') + NUM(q.price),
    pe: q.pe ? NUM(q.pe, 1) : '---',
    pnl: `<span class="${cls}">${sign}${pnlPct.toFixed(2)}%</span>`,
    pnlNum: pnlPct
  };
}

function renderMetrics(p) {
  document.getElementById('totalAssets').textContent = CNY(p.total_assets);
  document.getElementById('liquidAssets').textContent = CNY(p.liquid_assets);
  document.getElementById('attackAssets').textContent = CNY(p.attack.total);
  document.getElementById('attackRatio').textContent = '占可流动资产 ' + (p.attack.total / p.liquid_assets * 100).toFixed(1) + '%';
  document.getElementById('defenseAssets').textContent = CNY(p.defense.total);
  document.getElementById('defenseRatio').textContent = '占可流动资产 ' + (p.defense.total / p.liquid_assets * 100).toFixed(1) + '%';
  updateTencentExposure();
}

function updateTencentExposure() {
  if (!portfolio) return;
  const tencentEquity = 562980; // 腾讯直接持股
  const tencentFCN = 2000000; // 两笔 FCN
  const totalTencent = tencentEquity + tencentFCN;
  const pctLiquid = totalTencent / portfolio.liquid_assets * 100;
  document.getElementById('tencentExposure').textContent = CNY(totalTencent);
  document.getElementById('tencentWarning').textContent =
    '占可流动资产 ' + pctLiquid.toFixed(1) + '%（含 FCN 隐性杠杆）';

  // 如果腾讯价格低于 FCN 行权价，加强警告
  const q = prices['0700.HK'];
  if (q && q.price) {
    const strike1 = 421, strike2 = 447;
    if (q.price < strike1) {
      document.getElementById('tencentWarning').textContent += ' | FCN 行权价高于现价，接货风险高！';
      document.getElementById('tencentExposure').classList.add('red');
    } else if (q.price < strike2) {
      document.getElementById('tencentWarning').textContent += ' | FCN No.2 接近行权价';
      document.getElementById('tencentExposure').classList.add('amber');
    }
  }
}

function renderPositions(p) {
  // A股 & 港股
  const hk = p.attack.assets[0];
  let hkHtml = '';
  for (const h of hk.holdings) {
    if (!h.symbol) {
      const tagCls = h.tags.includes('投顾') ? 'tag-advisory' : 'tag-short';
      const tagLabel = h.tags.includes('投顾') ? '投顾' : '短期';
      hkHtml += `<tr>
        <td style="font-weight:500;">${h.name} <span style="font-size:11px;color:var(--text-muted);">${h.note}</span></td>
        <td><span class="tag ${tagCls}">${tagLabel}</span></td>
        <td class="num">${CNY(h.value)}</td>
        <td class="num">${h.ratio}%</td>
        <td class="num">---</td>
        <td class="num">---</td>
        <td class="num">---</td>
        <td class="num">---</td>
        <td class="num">---</td>
      </tr>`;
    } else {
      const { price, pe, pnl } = priceDisplay(h.symbol, h.cost, h.value);
      const tagEl = h.tags.length > 0
        ? `<span class="tag ${h.tags.includes('短期') ? 'tag-short' : ''}">${h.tags.join(', ')}</span>`
        : '';
      hkHtml += `<tr>
        <td style="font-weight:500;">${h.name}</td>
        <td>${tagEl}</td>
        <td class="num">${CNY(h.value)}</td>
        <td class="num">${h.ratio}%</td>
        <td class="num">${h.cost ? (h.symbol.includes('.HK') ? 'HK$' : '¥') + NUM(h.cost) : '---'}</td>
        <td class="num">${price}</td>
        <td class="num">${pe}</td>
        <td class="num">${h.target_pe || '---'}</td>
        <td class="num">${pnl}</td>
      </tr>`;
    }
  }
  document.getElementById('hkPositions').innerHTML = hkHtml;

  // 美股
  const us = p.attack.assets[1];
  let usHtml = '';
  for (const h of us.holdings) {
    const { price, pe, pnl } = priceDisplay(h.symbol, h.cost, h.value);
    const tagEl = h.tags.length > 0
      ? `<span class="tag tag-risk">风投</span>`
      : '';
    usHtml += `<tr>
      <td style="font-weight:500;">${h.name}</td>
      <td>${tagEl}</td>
      <td class="num">${CNY(h.value)}</td>
      <td class="num">${h.ratio}%</td>
      <td class="num">${h.cost ? '$' + NUM(h.cost) : '---'}</td>
      <td class="num">${price}</td>
      <td class="num">${pe}</td>
      <td class="num">${h.target_pe || '---'}</td>
      <td class="num">${pnl}</td>
    </tr>`;
  }
  document.getElementById('usPositions').innerHTML = usHtml;
}

function renderFCN(p) {
  const fcn = p.attack.assets[2];
  if (!fcn || !fcn.fcn_contracts) return;
  const now = new Date();
  let html = '';
  let hasWarning = false;
  let warningText = '';

  for (const c of fcn.fcn_contracts) {
    const expiry = new Date(c.expiry);
    const daysLeft = Math.ceil((expiry - now) / (1000 * 60 * 60 * 24));
    let daysCls = 'safe';
    if (daysLeft <= 7) daysCls = 'urgent';
    else if (daysLeft <= 30) daysCls = 'soon';

    const q = prices[c.symbol];
    const currentPrice = q ? q.price : null;
    const aboveStrike = currentPrice && currentPrice > c.strike;
    const margin = currentPrice ? ((currentPrice - c.strike) / c.strike * 100) : null;
    const statusCls = aboveStrike ? 'status-safe' : 'status-danger';
    const statusLabel = aboveStrike
      ? '安全（现价高于行权价 ' + margin.toFixed(1) + '%）'
      : '危险（现价低于行权价）';

    if (!aboveStrike && currentPrice) {
      hasWarning = true;
      warningText = 'FCN ' + c.id + ' 现价已低于行权价，到期可能触发接货！';
    }

    html += `<div class="fcn-card">
      <div class="fcn-header">
        <span class="fcn-title">FCN ${c.id} · ${c.underlying}</span>
        <span class="fcn-days ${daysCls}">${daysLeft}天后到期</span>
      </div>
      <div class="fcn-row">
        <span>面额:</span> ${CNY(c.value)}
        <span style="margin-left:16px;">行权价:</span> HK$${NUM(c.strike)}
        <span style="margin-left:16px;">现价:</span> ${currentPrice ? 'HK$'+NUM(currentPrice) : '<span class="price-loading">加载中</span>'}
        <span style="margin-left:16px;">票息率:</span> ${c.coupon_rate}%
        <span style="margin-left:16px;">到期日:</span> ${c.expiry}
      </div>
      <div class="status-bar"><div class="status-fill ${statusCls}" style="width:${aboveStrike ? '100' : '30'}%"></div></div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${statusLabel}</div>
    </div>`;
  }

  document.getElementById('fcnContainer').innerHTML = html;
  if (hasWarning && warningText) {
    document.getElementById('fcnWarning').style.display = 'flex';
    document.getElementById('fcnWarningText').textContent = warningText;
  } else {
    document.getElementById('fcnWarning').style.display = 'none';
  }
}

function renderWatchlist(p) {
  const allWatchlist = [];

  // 从持仓数据提取观察清单
  for (const assetGroup of p.attack.assets) {
    if (assetGroup.watchlist) {
      for (const w of assetGroup.watchlist) {
        allWatchlist.push({ ...w, category: assetGroup.category });
      }
    }
  }

  let html = '';
  for (const w of allWatchlist) {
    const q = w.symbol ? getPrice(w.symbol) : null;
    const priceStr = q && q.price
      ? (q.currency === 'HKD' ? 'HK$' : q.currency === 'USD' ? '$' : '¥') + NUM(q.price)
      : '<span class="price-loading">---</span>';

    // 估值状态判断
    let statusCls = 'status-watching';
    let statusLabel = '观察中';
    if (w.target_pe && q && q.pe) {
      const [peLow, peHigh] = w.target_pe.split('-').map(Number);
      if (q.pe < peLow) { statusCls = 'status-undervalued'; statusLabel = '低估'; }
      else if (q.pe > peHigh) { statusCls = 'status-overvalued'; statusLabel = '高估'; }
      else { statusCls = 'status-fair'; statusLabel = '合理'; }
    }

    html += `<div class="watch-card ${statusCls}">
      <div class="stock-name">${w.name} ${w.note ? '<span style="font-size:11px;color:var(--text-muted);">(' + w.note + ')</span>' : ''}</div>
      <div class="stock-symbol">${w.symbol || '---'} · ${w.market}</div>
      <div class="stock-price">${priceStr} <span style="font-size:11px;color:var(--text-secondary);">${statusLabel}</span></div>
      ${w.target_price ? '<div class="stock-target">目标: ' + w.target_price + '</div>' : ''}
      ${w.target_pe ? '<div class="stock-target">PE目标区间: ' + w.target_pe + '</div>' : ''}
      ${w.target_mcap ? '<div class="stock-target">目标市值: ' + w.target_mcap + '</div>' : ''}
    </div>`;
  }

  document.getElementById('watchlistGrid').innerHTML = html || '<div style="color:var(--text-muted);">暂无观察标的</div>';
}

// 启动
loadPortfolio();
loadPrices();
// 每60秒自动刷新股价
refreshTimer = setInterval(() => loadPrices(), 60000);
</script>
